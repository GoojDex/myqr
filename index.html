<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner - Apna Wi-Fi</title>
    <!-- html5-qrcode library CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg-color: #f0fdfa;
            --text-main: #1e293b;
            --white: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .scanner-box {
            background: var(--white);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        #qr-reader {
            width: 100%;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--primary);
            display: none;
        }
        .btn {
            width: 100%;
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .input-group {
            margin-top: 1.5rem;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scanner-box">
        <h2>Scan Voucher QR Code</h2>
        <p>Point your camera at the voucher QR code</p>

        <!-- QR Camera Viewfinder -->
        <div id="qr-reader"></div>

        <!-- Start Scanner Button -->
        <button type="button" class="btn" id="start-qr-btn" onclick="startQR()">
            <span style="font-size: 1.2rem;">📷</span> Open Camera to Scan
        </button>

        <!-- Result / Manual Input -->
        <div class="input-group">
            <label for="scannedCode">Scanned / Entered Code</label>
            <input type="text" id="scannedCode" placeholder="Code will appear here">
        </div>
    </div>

    <script>
        let html5QrcodeScanner = null;

        function startQR() {
            document.getElementById('qr-reader').style.display = 'block';
            document.getElementById('start-qr-btn').style.display = 'none';

            // Initializes the scanner using GitHub Pages HTTPS connection smoothly
            html5QrcodeScanner = new Html5QrcodeScanner(
                "qr-reader", { fps: 10, qrbox: 250 }, false);
            
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Stop scanner after successful scan
            html5QrcodeScanner.clear();
            document.getElementById('qr-reader').style.display = 'none';
            document.getElementById('start-qr-btn').style.display = 'flex';

            try {
                // If QR contains a full URL, extract username parameter, else use raw text
                let url = new URL(decodedText);
                let user = url.searchParams.get("username");
                document.getElementById('scannedCode').value = user ? user : decodedText;
            } catch(e) {
                document.getElementById('scannedCode').value = decodedText;
            }
            
            alert("Successfully Scanned: " + document.getElementById('scannedCode').value);
        }

        function onScanFailure(error) {
            // Handle scan failure silently to avoid console spam during continuous scanning
        }
    </script>
</body>
</html>
